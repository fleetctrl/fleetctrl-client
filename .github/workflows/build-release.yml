name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/ui/frontend/package-lock.json

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**\\go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Extract version from tag
        id: extract_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d{1,3}(\.\d{1,3}){0,3}$') {
            throw "Tag '$tag' is not a valid MSI ProductVersion source (expected vMAJOR[.MINOR][.PATCH][.BUILD])"
          }
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts.Count -ge 1 -and $parts[0] -gt 255) { throw "ProductVersion major must be <= 255" }
          if ($parts.Count -ge 2 -and $parts[1] -gt 255) { throw "ProductVersion minor must be <= 255" }
          if ($parts.Count -ge 3 -and $parts[2] -gt 65535) { throw "ProductVersion patch must be <= 65535" }
          if ($parts.Count -eq 4 -and $parts[3] -gt 65535) { throw "ProductVersion build must be <= 65535" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: cmd/ui/frontend
        run: npm ci

      - name: Test frontend
        working-directory: cmd/ui/frontend
        run: npm test

      - name: Build service (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          $version = "${{ steps.extract_version.outputs.version }}"
          go build -ldflags "-X KiskaLE/RustDesk-ID/internal/const.Version=$version" -o ".\bin\fleetctrl-client.exe" ".\cmd\main\"
          Copy-Item ".\bin\fleetctrl-client.exe" ".\bin\fleetctrl-client-$version.exe" -Force

      - name: Build desktop UI (Windows)
        shell: pwsh
        run: |
          Push-Location ".\cmd\ui"
          try {
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build `
              -clean `
              -platform windows/amd64 `
              -webview2 download `
              -o fleetctrl-ui.exe
          } finally {
            Pop-Location
          }

          $version = "${{ steps.extract_version.outputs.version }}"
          Copy-Item ".\cmd\ui\build\bin\fleetctrl-ui.exe" ".\bin\fleetctrl-ui.exe" -Force
          Copy-Item ".\bin\fleetctrl-ui.exe" ".\bin\fleetctrl-ui-$version.exe" -Force

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          $wixVersion = "4.0.0"
          dotnet tool update --global wix --version $wixVersion
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version $wixVersion
          }
          wix extension add -g "WixToolset.UI.wixext/$wixVersion"
          wix extension add -g "WixToolset.Util.wixext/$wixVersion"

      - name: Ensure Windows Installer service is available
        shell: pwsh
        run: |
          $svc = Get-Service msiserver
          if ($svc.StartType -eq 'Disabled') {
            Set-Service msiserver -StartupType Manual
          }
          if ($svc.Status -ne 'Running') {
            try {
              Start-Service msiserver -ErrorAction Stop
            } catch {
              msiexec /regserver
              Start-Sleep -Seconds 5
              Start-Service msiserver -ErrorAction Stop
            }
          }
          Get-Service msiserver | Format-List Name, Status, StartType

      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          wix build installer/installer.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d Version=$version `
            -arch x64 `
            -o "bin/fleetctrl-client-$version.msi"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ./bin/fleetctrl-client.exe
            ./bin/fleetctrl-client-${{ steps.extract_version.outputs.version }}.exe
            ./bin/fleetctrl-ui.exe
            ./bin/fleetctrl-ui-${{ steps.extract_version.outputs.version }}.exe
            ./bin/fleetctrl-client-${{ steps.extract_version.outputs.version }}.msi
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
