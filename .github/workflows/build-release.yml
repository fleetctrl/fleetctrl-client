name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Manual test build from any branch: uploads the EXE/MSI as a workflow artifact, no release.
  workflow_dispatch:
    inputs:
      version:
        description: "MSI version (MAJOR.MINOR.PATCH). Empty = Version from internal/const/consts.go"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Only a flag; the secrets themselves are exposed to the signing steps alone.
      HAS_CODESIGN: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Wails v2.13.0 bindings generation fails on Go 1.27 ("package ... without types")
          go-version: "1.26.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/ui/frontend/package-lock.json

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**\\go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Extract version
        id: extract_version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "$env:INPUT_VERSION".Trim()
            if ($version -eq "") {
              $match = Select-String -Path "internal/const/consts.go" -Pattern 'Version\s*=\s*"([^"]+)"' | Select-Object -First 1
              if (-not $match) { throw "Could not read Version from internal/const/consts.go" }
              $version = $match.Matches[0].Groups[1].Value
            }
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d{1,3}(\.\d{1,3}){0,3}$') {
            throw "'$version' is not a valid MSI ProductVersion (expected MAJOR[.MINOR][.PATCH][.BUILD])"
          }
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts.Count -ge 1 -and $parts[0] -gt 255) { throw "ProductVersion major must be <= 255" }
          if ($parts.Count -ge 2 -and $parts[1] -gt 255) { throw "ProductVersion minor must be <= 255" }
          if ($parts.Count -ge 3 -and $parts[2] -gt 65535) { throw "ProductVersion patch must be <= 65535" }
          if ($parts.Count -eq 4 -and $parts[3] -gt 65535) { throw "ProductVersion build must be <= 65535" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: cmd/ui/frontend
        run: npm ci

      - name: Test frontend
        working-directory: cmd/ui/frontend
        run: npm test

      - name: Build service (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          $version = "${{ steps.extract_version.outputs.version }}"
          # Version information, icon, and manifest of the EXE (cmd/main/rsrc_windows_amd64.syso).
          go run ./scripts/winres -version $version
          if ($LASTEXITCODE -ne 0) { throw "Generating the Windows resources of the service failed" }
          go build -ldflags "-X KiskaLE/RustDesk-ID/internal/const.Version=$version" -o ".\bin\fleetctrl-client.exe" ".\cmd\main\"
          Copy-Item ".\bin\fleetctrl-client.exe" ".\bin\fleetctrl-client-$version.exe" -Force

      - name: Build desktop UI (Windows)
        shell: pwsh
        run: |
          # Version shown in the file properties of fleetctrl-ui.exe; Wails reads it from wails.json.
          $wailsJson = (Resolve-Path ".\cmd\ui\wails.json").Path
          $wailsConfig = Get-Content $wailsJson -Raw -Encoding UTF8 | ConvertFrom-Json
          $wailsConfig.info | Add-Member -NotePropertyName productVersion -NotePropertyValue "${{ steps.extract_version.outputs.version }}" -Force
          # UTF-8 without BOM, which the Go JSON decoder in Wails requires.
          [IO.File]::WriteAllText($wailsJson, ($wailsConfig | ConvertTo-Json -Depth 10))

          Push-Location ".\cmd\ui"
          try {
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build `
              -clean `
              -platform windows/amd64 `
              -webview2 download `
              -o fleetctrl-ui.exe
          } finally {
            Pop-Location
          }

          $version = "${{ steps.extract_version.outputs.version }}"
          Copy-Item ".\cmd\ui\build\bin\fleetctrl-ui.exe" ".\bin\fleetctrl-ui.exe" -Force
          Copy-Item ".\bin\fleetctrl-ui.exe" ".\bin\fleetctrl-ui-$version.exe" -Force

      - name: Prepare code signing certificate
        if: env.HAS_CODESIGN == 'true'
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          "CODESIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Public part only (no private key), published with the release for GPO import.
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfx, $env:CODESIGN_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try {
            # .NET resolves relative paths against the process directory, so pass an absolute one.
            $cer = Join-Path (Resolve-Path ".\bin").Path "fleetctrl-codesign.cer"
            [IO.File]::WriteAllBytes($cer, $cert.Export("Cert"))
            Write-Output "Code signing certificate $($cert.Subject), thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter.ToString('yyyy-MM-dd'))"
          } finally {
            $cert.Dispose()
          }

      - name: Warn about unsigned build
        if: env.HAS_CODESIGN != 'true'
        shell: pwsh
        run: Write-Output "::warning::CODESIGN_PFX_BASE64 secret is not set, EXE and MSI files will be unsigned."

      # The EXE files must be signed before WiX packs them into the MSI.
      - name: Sign executables
        if: env.HAS_CODESIGN == 'true'
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: .\scripts\sign.ps1 .\bin\*.exe -PfxPath $env:CODESIGN_PFX_PATH

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          $wixVersion = "4.0.0"
          dotnet tool update --global wix --version $wixVersion
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version $wixVersion
          }
          wix extension add -g "WixToolset.UI.wixext/$wixVersion"
          wix extension add -g "WixToolset.Util.wixext/$wixVersion"

      - name: Ensure Windows Installer service is available
        shell: pwsh
        run: |
          $svc = Get-Service msiserver
          if ($svc.StartType -eq 'Disabled') {
            Set-Service msiserver -StartupType Manual
          }
          if ($svc.Status -ne 'Running') {
            try {
              Start-Service msiserver -ErrorAction Stop
            } catch {
              msiexec /regserver
              Start-Sleep -Seconds 5
              Start-Service msiserver -ErrorAction Stop
            }
          }
          Get-Service msiserver | Format-List Name, Status, StartType

      - name: Build MSI
        shell: pwsh
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          wix build installer/installer.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d Version=$version `
            -arch x64 `
            -o "bin/fleetctrl-client-$version.msi"

      - name: Sign MSI
        if: env.HAS_CODESIGN == 'true'
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: .\scripts\sign.ps1 ".\bin\fleetctrl-client-${{ steps.extract_version.outputs.version }}.msi" -PfxPath $env:CODESIGN_PFX_PATH

      - name: Remove code signing certificate
        if: always() && env.HAS_CODESIGN == 'true'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "codesign.pfx")

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fleetctrl-client-${{ steps.extract_version.outputs.version }}-run${{ github.run_number }}
          path: |
            ./bin/fleetctrl-client-${{ steps.extract_version.outputs.version }}.exe
            ./bin/fleetctrl-ui-${{ steps.extract_version.outputs.version }}.exe
            ./bin/fleetctrl-client-${{ steps.extract_version.outputs.version }}.msi
            ./bin/fleetctrl-codesign.cer
          if-no-files-found: error

      # fleetctrl-codesign.cer exists only for signed builds; a missing file is just a warning.
      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ./bin/fleetctrl-client-${{ steps.extract_version.outputs.version }}.msi
            ./bin/fleetctrl-codesign.cer
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
